server.port=8000
spring.application.name=xx-zuul

management.endpoints.web.exposure.include=hystrix.stream

##############
# \u6CE8\u518C\u4E2D\u5FC3\u914D\u7F6E
##############
# \u6CE8\u518C\u4E2D\u5FC3\u5730\u5740
eureka.client.service-url.defaultZone=http://eureka8701:8701/eureka,http://eureka8702:8702/eureka,http://eureka8703:8703/eureka
# \u670D\u52A1\u5B9E\u4F8B\u94FE\u63A5\u53D6IP\u800C\u4E0D\u662F\u673A\u5668\u540D
eureka.instance.prefer-ip-address=true
#eureka.instance.instance-id=xx-portal-01
# \u5411\u670D\u52A1\u7AEF\u53D1\u9001\u4E00\u6B21\u5FC3\u8DF3\u7684\u95F4\u9694\uFF0C\u8BC1\u660E\u81EA\u5DF1\u201C\u5B58\u6D3B\u201D
eureka.instance.lease-renewal-interval-in-seconds=2
# \u591A\u4E45\u6CA1\u6709\u5FC3\u8DF3\uFF0C\u8BC1\u660E\u81EA\u5DF1\u201C\u5B58\u6D3B\u201D\u65AD\u5F00
eureka.instance.lease-expiration-duration-in-seconds=10

##############
# \u914D\u7F6E\u4E2D\u5FC3\u914D\u7F6E
##############
# \u603B\u5F00\u5173\u3002\u5982\u679C\u4E3Afalse\uFF08\u9ED8\u8BA4\uFF09\u5219\u4E2D\u5FC3\u4ED3\u5E93\u914D\u7F6E\u6700\u9AD8\uFF0C\u672C\u5730\u65E0\u6CD5\u8986\u76D6
spring.cloud.config.allow-override=true
# \u4E2D\u5FC3\u4ED3\u5E93\u914D\u7F6E\u53EA\u8986\u76D6none\u914D\u7F6E\u3002 \u2014\u2014 \u5C06\u4E2D\u5FC3\u4ED3\u5E93\u914D\u7F6E\u4F18\u5148\u7EA7\u8C03\u81F3\u6700\u4F4E
spring.cloud.config.override-none=true
# \u4E2D\u5FC3\u4ED3\u5E93\u914D\u7F6E\u4E0D\u8986\u76D6\u7CFB\u7EDF\u53C2\u6570\uFF08\u5982 java -Dxxx \u548C\u73AF\u5883\u53D8\u91CF\uFF09
spring.cloud.config.override-system-properties=false

##############
# \u7F51\u5173\u914D\u7F6E
##############
zuul.prefix=/
# \u9ED8\u8BA4zuul\u53EF\u4EE5\u901A\u8FC7\uFF1A1\u3001\u670D\u52A1\u540D\u8DEF\u7531\uFF1B2\u3001\u8DEF\u7531\u89C4\u5219\u8DEF\u7531
# 1\u3001\u5173\u95ED\u670D\u52A1\u540D\u8DEF\u7531
zuul.ignored-services=*
# 2\u3001\u914D\u7F6E\u8DEF\u7531\u89C4\u5219\u8DEF\u7531
zuul.routes.portal.path=/portal/**
zuul.routes.portal.service-id=xx-portal

# \u5173\u95ED\u9ED8\u8BA4\u5F02\u5E38\u5904\u7406\uFF0C\u4F7F\u7528\u81EA\u5B9A\u4E49\u5F02\u5E38\u5904\u7406
zuul.SendErrorFilter.error.disable=true

# \u63A5\u53E3\u8D85\u65F6
ribbon.ReadTimeout=2000
hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=3000
