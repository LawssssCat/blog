server.port=9300
spring.application.name=xx-config

# \u6253\u5F00\u6240\u6709\u7684web\u8BBF\u95EE\u7AEF\u70B9
management.endpoints.web.exposure.include=*

##############
# \u914D\u7F6E\u4E2D\u5FC3
##############
# \u5B58\u5230git\u4E2D\u5FC3
#spring.cloud.config.server.git.uri=http://github.com/xxx/xxx.git
#spring.cloud.config.server.git.search-paths=config-center
#spring.cloud.config.server.git.username=xxx
#spring.cloud.config.server.git.passphrase=123321
# \u5B58\u5230\u672C\u5730
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:./xx-config/config-repo

# \u6D88\u606F\u961F\u5217
#spring.cloud.bus.enabled=true
#spring.rabbitmq.host=127.0.0.1
#spring.rabbitmq.port=5672
#spring.rabbitmq.username=guest
#spring.rabbitmq.password=guest

##############
# \u6CE8\u518C\u4E2D\u5FC3\u914D\u7F6E
##############
# \u6CE8\u518C\u4E2D\u5FC3\u5730\u5740
eureka.client.service-url.defaultZone=http://eureka8701:8701/eureka,http://eureka8702:8702/eureka,http://eureka8703:8703/eureka
# \u670D\u52A1\u5B9E\u4F8B\u94FE\u63A5\u53D6IP\u800C\u4E0D\u662F\u673A\u5668\u540D
#eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=xx-config-native
# \u5411\u670D\u52A1\u7AEF\u53D1\u9001\u4E00\u6B21\u5FC3\u8DF3\u7684\u95F4\u9694\uFF0C\u8BC1\u660E\u81EA\u5DF1\u201C\u5B58\u6D3B\u201D
eureka.instance.lease-renewal-interval-in-seconds=2
# \u591A\u4E45\u6CA1\u6709\u5FC3\u8DF3\uFF0C\u8BC1\u660E\u81EA\u5DF1\u201C\u5B58\u6D3B\u201D\u65AD\u5F00
eureka.instance.lease-expiration-duration-in-seconds=10
