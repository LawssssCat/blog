server.port=9000
spring.application.name=xx-portal

# \u6253\u5F00\u6240\u6709\u7684web\u8BBF\u95EE\u7AEF\u70B9
management.endpoints.web.exposure.include=*

# \u6CE8\u518C\u4E2D\u5FC3\u5730\u5740
eureka.client.service-url.defaultZone=http://eureka8701:8701/eureka
# \u670D\u52A1\u5B9E\u4F8B\u94FE\u63A5\u53D6IP\u800C\u4E0D\u662F\u673A\u5668\u540D
eureka.instance.prefer-ip-address=true
#eureka.instance.instance-id=xx-portal-01
# \u5411\u670D\u52A1\u7AEF\u53D1\u9001\u4E00\u6B21\u5FC3\u8DF3\u7684\u95F4\u9694\uFF0C\u8BC1\u660E\u81EA\u5DF1\u201C\u5B58\u6D3B\u201D
eureka.instance.lease-renewal-interval-in-seconds=2
# \u591A\u4E45\u6CA1\u6709\u5FC3\u8DF3\uFF0C\u8BC1\u660E\u81EA\u5DF1\u201C\u5B58\u6D3B\u201D\u65AD\u5F00
eureka.instance.lease-expiration-duration-in-seconds=10

#ribbon.ReadTimeout=6000
#ribbon.ConnectTimeout=3000

# \u7194\u65AD\u65F6\u95F4
# \u8BF4\u660E\uFF1A\u7531\u4E8EHystrix\u7684\u914D\u7F6E\u9879\u662F\u52A8\u6001\u62FC\u63A5\u7684hystrix.command.{CommandKey}.xxx\uFF0C\u6240\u4EE5\u4F1A\u6709\u201C\u65E0\u6CD5\u89E3\u6790\u914D\u7F6E\u5C5E\u6027\u201D\u544A\u8B66\u3002
hystrix.command.default.execution.timeout.enabled=true
hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=2000
